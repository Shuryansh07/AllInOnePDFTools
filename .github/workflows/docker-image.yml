name: Docker image

# Builds the production image, proves it works, and stores it as a downloadable
# workflow artifact. Download it from the run's "Artifacts" section, then:
#   gunzip pdf-parser-<sha>.tar.gz && docker load -i pdf-parser-<sha>.tar

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      site_url:
        description: Public URL baked into the build (canonical links, sitemap, social previews)
        required: false
        type: string

permissions:
  contents: read

# A newer push to the same ref makes an in-progress build obsolete.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: pdf-parser
  # Manual input wins, then the repository variable SITE_URL, then a safe default.
  SITE_URL: ${{ inputs.site_url || vars.SITE_URL || 'http://localhost:3000' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
          # Write the image to a tar file instead of a registry.
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Don't store an image that doesn't work: the container must report healthy,
      # which means the app is up AND Ghostscript and qpdf can actually run.
      - name: Smoke test
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker run -d --name app -p 3000:3000 "$IMAGE_NAME:$GITHUB_SHA"

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed. Container logs:"
          docker logs app
          exit 1

      - name: Compress image
        run: gzip -c "$RUNNER_TEMP/image.tar" > "$RUNNER_TEMP/$IMAGE_NAME-$GITHUB_SHA.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-image-${{ github.sha }}
          path: ${{ runner.temp }}/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar.gz
          if-no-files-found: error
          # The file is already gzipped; compressing again only wastes time.
          compression-level: 0
          # Images are large and Actions storage is limited, so keep them briefly.
          retention-days: 3

      - name: Summary
        run: |
          {
            echo "### Docker image built"
            echo
            echo "- Image: \`$IMAGE_NAME:$GITHUB_SHA\`"
            echo "- \`SITE_URL\` baked in: \`$SITE_URL\`"
            echo "- Size: $(du -h "$RUNNER_TEMP/$IMAGE_NAME-$GITHUB_SHA.tar.gz" | cut -f1) (gzipped)"
            echo
            echo "Download the artifact, then load and run it:"
            echo
            echo '```bash'
            echo "gunzip $IMAGE_NAME-$GITHUB_SHA.tar.gz"
            echo "docker load -i $IMAGE_NAME-$GITHUB_SHA.tar"
            echo "docker run -d -p 3000:3000 $IMAGE_NAME:$GITHUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
