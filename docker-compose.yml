services:
  web:
    build:
      context: .
      args:
        # Set to your public URL for correct canonical links, sitemap and social previews.
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    # Compression runs Ghostscript on user files; cap what a runaway job can use.
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
